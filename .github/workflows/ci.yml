name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio

      - name: Import smoke test
        run: python -c "import server; print('tools:', len([t for t in dir(server) if t.startswith('cnki_')]))"

      - name: Compile all sources
        run: python -m compileall cnki server.py

      # 仅跑不依赖网络/登录的纯逻辑测试；需真实 CNKI/Zotero 的用例不在此文件
      - name: Unit tests (offline only)
        run: pytest tests/test_unit.py -v
