[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnki-mcp"
version = "0.1.0"
description = "MCP server for CNKI (China National Knowledge Infrastructure) literature search, PDF download, and Zotero import"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wuruiqi" }]
keywords = ["mcp", "cnki", "zotero", "literature", "playwright", "research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp[cli]>=1.27.0",
    "playwright>=1.44.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/wuruiqi/cnki-mcp"
Repository = "https://github.com/wuruiqi/cnki-mcp"
Issues = "https://github.com/wuruiqi/cnki-mcp/issues"

[project.scripts]
cnki-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
packages = ["cnki"]

[tool.pytest.ini_options]
markers = [
    "integration: 需要真实 CNKI 登录 / Zotero 桌面端，CI 中跳过",
]
